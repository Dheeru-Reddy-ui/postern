name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (threat model TM-28).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run --locked ruff check --output-format=github .
          uv run --locked ruff format --check .

      - name: Types
        run: uv run --locked mypy

      - name: Tests
        run: uv run --locked pytest

      - name: Repo hygiene
        env:
          # ruff and mypy already ran above.
          SKIP: ruff-check,ruff-format,mypy
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
